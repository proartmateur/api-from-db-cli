[package]
name = "api-from-db-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiberius = { version = "0.12", default-features = false, features = ["tokio", "rustls"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
